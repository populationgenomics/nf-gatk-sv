[project]
name = "nf-gatk-sv"
version = "0.1.0"
description = "Nextflow port of cpg-flow-gatk-sv"
requires-python = ">=3.14"
dependencies = [
    # core install only: never import cpg_utils.cromwell / hail_batch / dataproc (they pull in hailtop).
    # cpg_utils.cromwell_client is the Cromwell client (plan D6)
    "cpg-utils>=5.9.0",
    "loguru==0.7.3",
    "metamist>=7",
    "numpy==2.4.6",
    "pandas==2.3.3",
]

[project.scripts]
nf-gatk-sv = "gatk_sv_nf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gatk_sv_nf"]

[tool.uv.sources]
# cpg_utils.cromwell_client is not released yet: drop this once a cpg-utils release has it
cpg-utils = { git = "https://github.com/populationgenomics/cpg-utils", branch = "non-hail-cromwell-client" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py314"
# copied from cpg-flow-gatk-sv and kept byte-identical below their header (plan §8): never reformat
extend-exclude = ["src/gatk_sv_nf/scripts/*.py"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S", "BLE"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "S101",    # asserts are fine in tests
    "S603", "S607",  # subprocess with git is deliberate
]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["S", "PLC0415", "BLE001", "E402"]
"parity/*" = ["PLC0415", "S"]

[tool.ruff.lint.isort]
known-first-party = ["gatk_sv_nf"]

[tool.pytest.ini_options]
testpaths = ["test"]
filterwarnings = ["ignore::FutureWarning"]
