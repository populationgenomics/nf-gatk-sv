[project]
name = "cpg-cromwell"
version = "0.1.0"
description = "Hail-free client and CLI for the CPG Cromwell server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # core install only: never import cpg_utils.cromwell / hail_batch / dataproc (they pull in hailtop)
    "cpg-utils>=5.8.1",
    "google-cloud-storage>=2.10",
    "requests>=2.31",
]

[project.scripts]
cpg-cromwell = "cpg_cromwell.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpg_cromwell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]
